# Run the bot 24/7 in Docker.
#   cd bybit-options-bot
#   cp .env.example .env   # fill in NEW keys + dedicated Telegram channel
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml logs -f
# Emergency stop: `touch .KILL` (mounted in), or `docker compose ... down`.
services:
  bybit-options-bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: bybit-options-bot
    container_name: bybit-options-bot
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../logs:/app/logs
      - ../state:/app/state
      - ../config.yaml:/app/config.yaml:ro
      - ../.KILL:/app/.KILL:ro # create ../.KILL on host to halt trading
    # Default = full loop (honours BYBIT_LIVE). For scan-only, override:
    # command: ["python", "run.py", "--no-exec"]
    command: ["python", "run.py"]
