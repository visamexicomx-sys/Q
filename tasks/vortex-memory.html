<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Memory — Generative Art</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        .sidebar {
            width: 300px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 22px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 6px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 11px;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .control-section { margin-bottom: 26px; }

        .control-section h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 10px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 10px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .control-group { margin-bottom: 16px; }

        .control-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 6px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 15px;
            height: 15px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: var(--anthropic-mid-gray);
            min-width: 38px;
            text-align: right;
        }

        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            font-family: 'Poppins', sans-serif;
        }

        .button:hover { background: #c86641; transform: translateY(-1px); }
        .button:active { transform: translateY(0); }
        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }
        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }

        .button-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .button-row .button { flex: 1; }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 860px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(13, 15, 26, 0.5);
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 400px;
            font-size: 14px;
            color: #666;
            background: #0d0f1a;
        }

        @media (max-width: 600px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Vortex Memory</h1>
            <div class="subtitle">
                Thousands of tracers drift through superimposed invisible vortex fields. Their accumulated paths reveal the hidden topology of pure mathematical forces.
            </div>

            <!-- Seed -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <!-- Parameters -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Particle Count</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="500" max="7000" step="250" value="3500"
                               oninput="updateParam('particleCount', +this.value)">
                        <span class="value-display" id="particleCount-value">3500</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Vortex Count</label>
                    <div class="slider-container">
                        <input type="range" id="vortexCount" min="2" max="18" step="1" value="9"
                               oninput="updateParam('vortexCount', +this.value, true)">
                        <span class="value-display" id="vortexCount-value">9</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Field Strength</label>
                    <div class="slider-container">
                        <input type="range" id="fieldStrength" min="0.1" max="4.0" step="0.1" value="1.2"
                               oninput="updateParam('fieldStrength', +this.value)">
                        <span class="value-display" id="fieldStrength-value">1.2</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Max Speed</label>
                    <div class="slider-container">
                        <input type="range" id="maxSpeed" min="0.5" max="7.0" step="0.25" value="3.5"
                               oninput="updateParam('maxSpeed', +this.value)">
                        <span class="value-display" id="maxSpeed-value">3.5</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Trail Persistence</label>
                    <div class="slider-container">
                        <input type="range" id="fadeRate" min="1" max="35" step="1" value="9"
                               oninput="updateParam('fadeRate', +this.value)">
                        <span class="value-display" id="fadeRate-value">9</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Vortex Drift</label>
                    <div class="slider-container">
                        <input type="range" id="driftSpeed" min="0" max="2.5" step="0.1" value="0.5"
                               oninput="updateParam('driftSpeed', +this.value)">
                        <span class="value-display" id="driftSpeed-value">0.5</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Hue Rotation</label>
                    <div class="slider-container">
                        <input type="range" id="hueShift" min="0" max="1.0" step="0.02" value="0.0"
                               oninput="updateParam('hueShift', +this.value)">
                        <span class="value-display" id="hueShift-value">0.0</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Particle Glow</label>
                    <div class="slider-container">
                        <input type="range" id="glowAlpha" min="10" max="90" step="5" value="50"
                               oninput="updateParam('glowAlpha', +this.value)">
                        <span class="value-display" id="glowAlpha-value">50</span>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="reinitialize()">Regenerate</button>
                    <button class="button secondary" onclick="resetParameters()">Reset</button>
                </div>
                <button class="button tertiary" onclick="exportArt()">↓ Download PNG</button>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing vortex fields…</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════
        // PARAMETERS
        // ═══════════════════════════════════════════════════════
        let params = {
            seed: 12345,
            particleCount: 3500,
            vortexCount: 9,
            fieldStrength: 1.2,
            maxSpeed: 3.5,
            fadeRate: 9,
            driftSpeed: 0.5,
            hueShift: 0.0,
            glowAlpha: 50,
        };
        let defaultParams = { ...params };

        let vortices = [];
        let tracers  = [];

        // ═══════════════════════════════════════════════════════
        // VORTEX — point-vortex fluid dynamics
        // ═══════════════════════════════════════════════════════
        class Vortex {
            constructor() {
                this.cx   = random(width * 0.12, width * 0.88);
                this.cy   = random(height * 0.12, height * 0.88);
                // Raw strength (fieldStrength applied at query time for live updates)
                this.rawStrength = (random() < 0.5 ? 1 : -1) * random(500, 2400);
                this.driftAngle  = random(TWO_PI);
                this.driftRate   = random(0.004, 0.014);
                this.driftRadius = random(0.25, 1.1);
                // Slow breathing — strength oscillates slightly
                this.breathPhase = random(TWO_PI);
                this.breathRate  = random(0.003, 0.009);
            }

            update() {
                this.driftAngle  += this.driftRate;
                this.breathPhase += this.breathRate;
                let drift = this.driftRadius * params.driftSpeed;
                this.cx += cos(this.driftAngle) * drift;
                this.cy += sin(this.driftAngle) * drift * 0.7;
                // Gentle wall repulsion
                let pad = 60;
                if (this.cx < pad)          this.cx += (pad - this.cx)          * 0.04;
                if (this.cx > width - pad)  this.cx -= (this.cx - width + pad)  * 0.04;
                if (this.cy < pad)          this.cy += (pad - this.cy)          * 0.04;
                if (this.cy > height - pad) this.cy -= (this.cy - height + pad) * 0.04;
            }

            getForce(x, y) {
                let dx = x - this.cx;
                let dy = y - this.cy;
                let r2 = dx * dx + dy * dy;
                // Soft core prevents singularity; falloff ~ 1/r²
                let r2safe   = max(r2, 800);
                let breath   = 1 + 0.18 * sin(this.breathPhase);
                let strength = this.rawStrength * params.fieldStrength * breath;
                let scale    = strength / r2safe;
                // Tangential: (-dy, dx) for CCW; (dy, -dx) for CW
                return { x: -dy * scale, y: dx * scale };
            }
        }

        // ═══════════════════════════════════════════════════════
        // TRACER — inertial particle following the field
        // ═══════════════════════════════════════════════════════
        class Tracer {
            constructor(randomAge) {
                this.spawn();
                if (randomAge) this.age = floor(random(this.maxAge));
            }

            spawn() {
                // Distribute birth positions uniformly; slight edge bias for drama
                this.x      = random(width);
                this.y      = random(height);
                this.vx     = 0;
                this.vy     = 0;
                this.age    = 0;
                this.maxAge = floor(random(180, 700));
                // Per-particle noise offset for micro-turbulence
                this.nx = random(1000);
                this.ny = random(2000);
            }

            update() {
                let fx = 0, fy = 0;
                for (let v of vortices) {
                    let f = v.getForce(this.x, this.y);
                    fx += f.x;
                    fy += f.y;
                }

                // Organic micro-turbulence from Perlin noise
                let nt  = frameCount * 0.0008;
                let nmx = (noise(this.x * 0.0018, this.y * 0.0018, this.nx + nt) - 0.5) * 0.6;
                let nmy = (noise(this.x * 0.0018, this.y * 0.0018, this.ny + nt) - 0.5) * 0.6;
                fx += nmx;
                fy += nmy;

                // Inertial smoothing — 0.85 damp ratio tuned for orbital elegance
                this.vx = this.vx * 0.85 + fx * 0.15;
                this.vy = this.vy * 0.85 + fy * 0.15;

                // Speed clamp
                let spd = sqrt(this.vx * this.vx + this.vy * this.vy);
                if (spd > params.maxSpeed) {
                    let inv = params.maxSpeed / spd;
                    this.vx *= inv;
                    this.vy *= inv;
                }

                this.x += this.vx;
                this.y += this.vy;
                this.age++;

                let oob = this.x < -15 || this.x > width + 15 || this.y < -15 || this.y > height + 15;
                if (this.age > this.maxAge || oob) this.spawn();
            }

            draw() {
                let lifeRatio = this.age / this.maxAge;
                // Sine envelope: fade in quickly, hold, fade out
                let alpha = sin(lifeRatio * PI) * params.glowAlpha;

                // Color from instantaneous velocity angle
                let angle = atan2(this.vy, this.vx);
                let t     = ((angle + PI) / TWO_PI + params.hueShift) % 1.0;

                let [r, g, b] = plasmaRGB(t);
                // Size slightly bigger near vortex centers (high speed)
                let spd = sqrt(this.vx * this.vx + this.vy * this.vy);
                let sz  = map(spd, 0, params.maxSpeed, 1.2, 3.2);

                noStroke();
                fill(r, g, b, alpha);
                ellipse(this.x, this.y, sz, sz);
            }
        }

        // ═══════════════════════════════════════════════════════
        // PLASMA GRADIENT  (no HSB mode-switching — pure RGB math)
        // Eight stops, vivid spectral loop: blue→cyan→green→gold→coral→magenta→violet→blue
        // ═══════════════════════════════════════════════════════
        const PALETTE = [
            [70,  110, 255],   // 0.000  electric blue
            [0,   210, 255],   // 0.143  cyan
            [0,   255, 155],   // 0.286  sea-green
            [190, 255,  30],   // 0.429  lime-gold
            [255, 185,   0],   // 0.571  amber
            [255,  55,  75],   // 0.714  coral-red
            [255,   0, 195],   // 0.857  magenta
            [130,  50, 255],   // 1.000  violet (→ wraps to blue)
        ];

        function plasmaRGB(t) {
            let idx = t * (PALETTE.length - 1);
            let i   = floor(idx);
            let f   = idx - i;
            let c0  = PALETTE[Math.min(i,     PALETTE.length - 1)];
            let c1  = PALETTE[Math.min(i + 1, PALETTE.length - 1)];
            return [
                lerp(c0[0], c1[0], f),
                lerp(c0[1], c1[1], f),
                lerp(c0[2], c1[2], f),
            ];
        }

        // ═══════════════════════════════════════════════════════
        // P5.JS LIFECYCLE
        // ═══════════════════════════════════════════════════════
        function setup() {
            let canvas = createCanvas(1000, 1000);
            canvas.parent('canvas-container');
            document.querySelector('.loading').style.display = 'none';
            reinitialize();
        }

        function reinitialize() {
            randomSeed(params.seed);
            noiseSeed(params.seed);

            // Deep space background
            background(13, 15, 26);

            vortices = [];
            for (let i = 0; i < params.vortexCount; i++) {
                vortices.push(new Vortex());
            }

            tracers = [];
            for (let i = 0; i < params.particleCount; i++) {
                tracers.push(new Tracer(true)); // stagger ages for instant richness
            }
        }

        function draw() {
            // Semi-transparent fade — controls how long trails persist
            blendMode(BLEND);
            fill(13, 15, 26, params.fadeRate);
            noStroke();
            rect(0, 0, width, height);

            // Additive blending: overlapping particles accumulate into bright caustic hotspots
            blendMode(ADD);
            for (let t of tracers) {
                t.update();
                t.draw();
            }

            // Update vortex positions (drift + breathe)
            blendMode(BLEND);
            for (let v of vortices) v.update();

            // Live particle count adjustment
            while (tracers.length < params.particleCount) tracers.push(new Tracer(false));
            while (tracers.length > params.particleCount) tracers.pop();
        }

        // ═══════════════════════════════════════════════════════
        // PARAMETER UPDATES
        // ═══════════════════════════════════════════════════════
        function updateParam(name, value, needsReinit = false) {
            params[name] = value;
            let el = document.getElementById(name + '-value');
            if (el) el.textContent = Number.isInteger(value) ? value : value.toFixed(2);
            if (needsReinit) reinitialize();
        }

        function exportArt() {
            saveCanvas('vortex-memory-seed-' + params.seed, 'png');
        }

        // ═══════════════════════════════════════════════════════
        // SEED CONTROLS
        // ═══════════════════════════════════════════════════════
        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let v = parseInt(document.getElementById('seed-input').value);
            if (v && v > 0) { params.seed = v; reinitialize(); }
            else updateSeedDisplay();
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            reinitialize();
        }

        function nextSeed() {
            params.seed++;
            updateSeedDisplay();
            reinitialize();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            reinitialize();
        }

        // ═══════════════════════════════════════════════════════
        // RESET
        // ═══════════════════════════════════════════════════════
        function resetParameters() {
            params = { ...defaultParams };
            const fields = ['particleCount','vortexCount','fieldStrength','maxSpeed',
                            'fadeRate','driftSpeed','hueShift','glowAlpha'];
            fields.forEach(k => {
                let el = document.getElementById(k);
                if (el) el.value = params[k];
                let dEl = document.getElementById(k + '-value');
                if (dEl) dEl.textContent = Number.isInteger(params[k]) ? params[k] : params[k].toFixed(2);
            });
            updateSeedDisplay();
            reinitialize();
        }

        window.addEventListener('load', updateSeedDisplay);
    </script>
</body>
</html>
